<style>
:root{
  color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--surface-2:#211f1e;
  --ink:#fff;--ink-2:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,0.10);
  --good:#0ca30c;--bad:#e66767;--gold:#fab219;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#9085e9;
  --radius:14px;--font:system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-theme="light"]{
  color-scheme:light;
  --page:#f9f9f7;--surface:#fcfcfb;--surface-2:#f2f1ec;
  --ink:#0b0b0b;--ink-2:#52514e;--muted:#898781;
  --grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,0.10);
  --good:#0a8f0a;--bad:#d03b3b;--gold:#b8790a;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#4a3aa7;
}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font);background:var(--page);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:var(--s1);text-decoration:none}.tnum{font-variant-numeric:tabular-nums}
header.topbar{position:sticky;top:0;z-index:20;backdrop-filter:saturate(1.4) blur(8px);background:color-mix(in srgb,var(--page) 82%,transparent);border-bottom:1px solid var(--border)}
.topwrap{max-width:1440px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand .logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--s1),var(--s6));display:grid;place-items:center;font-size:19px}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.spacer{flex:1}
.status{font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
.status.live{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
select,.btn,input{font-family:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:7px 11px}
.btn,select{cursor:pointer}.btn:hover,select:hover{border-color:var(--muted)}
.btn.primary{background:var(--s1);border-color:var(--s1);color:#fff;font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
nav.tabs{max-width:1440px;margin:0 auto;padding:0 22px;display:flex;gap:4px;overflow-x:auto}
.tab{appearance:none;border:0;background:none;font-family:inherit;font-size:14px;font-weight:600;color:var(--muted);padding:12px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink-2)}.tab.active{color:var(--ink);border-bottom-color:var(--s1)}
main{max-width:1440px;margin:0 auto;padding:26px 22px 80px}
.view{display:none;animation:fade .3s ease}.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h2.section{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:34px 0 14px;font-weight:700}
h2.section:first-child{margin-top:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:820px){.g2,.g3{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.g2,.g3{grid-template-columns:1fr}.topwrap{padding:12px 16px}main{padding:20px 14px 70px}}
.champ-banner{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 20%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);border-radius:var(--radius);padding:16px 20px}
.champ-banner .cup{font-size:38px}.champ-banner .who{font-size:22px;font-weight:800}.champ-banner .sub{font-size:12.5px;color:var(--ink-2)}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 17px}
.tile .k{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.tile .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:5px}
.tile .v small{font-size:14px;color:var(--muted);font-weight:600}.tile .s{font-size:12.5px;color:var(--ink-2);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:9px 9px;border-bottom:1px solid var(--border);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;border-bottom:1px solid var(--axis)}
tbody tr:hover{background:var(--surface-2)}
td.who{display:flex;align-items:center;gap:9px;font-weight:600}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.rank{color:var(--muted);width:20px;display:inline-block;text-align:right;margin-right:7px;font-variant-numeric:tabular-nums}
.badge-champ{font-size:10.5px;font-weight:800;color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:999px;padding:2px 7px}
.svgc{width:100%;height:auto;display:block;overflow:visible}.svgc text{font-family:var(--font)}
.axislbl{fill:var(--muted);font-size:11px}.vallbl{fill:var(--ink);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:12px}
.legend .li{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.legend .li .sw{width:12px;height:12px;border-radius:3px}
.wk{overflow-x:auto}.wk table{font-size:12.5px}
.wk th,.wk td{border:1px solid var(--border);text-align:center;padding:0}
.wk thead th{padding:9px 8px}
.wk td.wklbl{text-align:left;padding:7px 11px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.wk td.pl{width:92px;height:40px}
.cellwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:40px;line-height:1.15}
.cellwrap .p{font-weight:800;font-size:13px}.cellwrap .sc{font-size:11px;opacity:.85;font-variant-numeric:tabular-nums}
.hint{font-size:12.5px;color:var(--muted);margin:9px 0 0}
.footer{color:var(--muted);font-size:12.5px;margin-top:40px;text-align:center;line-height:1.7}
.tag{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:2px 9px;margin-left:8px;vertical-align:middle}
pre{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:12px 14px;overflow:auto;font-size:12.5px}
/* entry form */
.form-row{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.field input,.field select{min-width:120px}
.entry-tbl{border-collapse:collapse;width:auto;margin-top:4px}
.entry-tbl th,.entry-tbl td{border-bottom:1px solid var(--border);padding:10px 22px 10px 0;text-align:left;white-space:nowrap}
.entry-tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
.entry-tbl td.who{font-weight:600;min-width:130px}
.entry-tbl select{width:92px}
.entry-tbl input{width:128px}
.entry-tbl th:last-child,.entry-tbl td:last-child{padding-right:0}
.msg{margin-top:14px;font-size:13.5px;font-weight:600;padding:10px 13px;border-radius:9px;display:none}
.msg.show{display:block}
.msg.ok{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent);border:1px solid color-mix(in srgb,var(--good) 30%,transparent)}
.msg.err{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent)}
.notice{font-size:13px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:11px 14px;margin-bottom:16px}

.zgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
@media(max-width:1000px){.zgrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:620px){.zgrid{grid-template-columns:repeat(2,1fr)}}

.zhead{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13.5px;margin-bottom:7px;border-bottom:1px solid var(--border);padding-bottom:7px}
.zhead .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zhead .tot{color:var(--gold);font-variant-numeric:tabular-nums}
.zrow{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;padding:3px 0}
.zrow .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zrow .r{color:var(--ink-2);font-variant-numeric:tabular-nums;flex:none}
.zrow .pn{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
h2.section .tag{white-space:nowrap}
/* ---- mobile: condense dense list tables so they fit without side-scroll ---- */
@media(max-width:560px){
  th,td{padding:7px 6px}
  table{font-size:12px}
  .rank{margin-right:4px}
  /* Season standings → Player, Avg Fin, 1st, 6th, Points */
  .tbl-standings th:nth-child(4),.tbl-standings td:nth-child(4),
  .tbl-standings th:nth-child(5),.tbl-standings td:nth-child(5),
  .tbl-standings th:nth-child(6),.tbl-standings td:nth-child(6),
  .tbl-standings th:nth-child(7),.tbl-standings td:nth-child(7),
  .tbl-standings th:nth-child(10),.tbl-standings td:nth-child(10),
  .tbl-standings th:nth-child(11),.tbl-standings td:nth-child(11){display:none}
  /* Win Pool summary → Player, Total Wins only */
  .tbl-winpool th:nth-child(3),.tbl-winpool td:nth-child(3),
  .tbl-winpool th:nth-child(4),.tbl-winpool td:nth-child(4){display:none}
  /* All-Time Leaderboard → Player, Contest Wins, Avg Fin */
  .tbl-leader th:nth-child(4),.tbl-leader td:nth-child(4),
  .tbl-leader th:nth-child(5),.tbl-leader td:nth-child(5),
  .tbl-leader th:nth-child(6),.tbl-leader td:nth-child(6),
  .tbl-leader th:nth-child(7),.tbl-leader td:nth-child(7){display:none}
  /* Payout → Player, Collects, Pays, Net */
  .tbl-payout th:nth-child(2),.tbl-payout td:nth-child(2),
  .tbl-payout th:nth-child(3),.tbl-payout td:nth-child(3){display:none}
}

const SERIES=["--s1","--s2","--s3","--s4","--s5","--s6"];

/* ============ MODEL (rebuilds when data changes) ============ */
let R=[], SEASONS=[], ALL_SEASONS=[], LATEST=null, SEASON=null;
function ingest(rows){
  R = rows.map(a=>({
    season:+a[0], week:String(a[1]), kind:a[2],
    p: (typeof a[3]==='number')?a[3]:PLAYERS.indexOf(a[3]),
    place:(a[4]==null||a[4]==='')?null:+a[4],
    score:(a[5]==null||a[5]==='')?null:+a[5]
  })).filter(x=>x.p>=0);
  SEASONS=[...new Set(R.map(x=>x.season))].sort((a,b)=>a-b);         // seasons WITH data
  LATEST=SEASONS.length?SEASONS[SEASONS.length-1]:CURRENT_SEASON;    // last completed season
  ALL_SEASONS=[...new Set([...SEASONS,CURRENT_SEASON])].sort((a,b)=>a-b); // + current (may be empty)
  if(SEASON==null || !ALL_SEASONS.includes(SEASON)) SEASON=CURRENT_SEASON;
}
const N=PLAYERS.length;
function champOf(season){const c=R.find(x=>x.season===season&&x.kind==='c'&&x.place===1);return c?c.p:null;}
function agg(rows){
  const out=PLAYERS.map((_,i)=>({p:i,gp:0,places:[0,0,0,0,0,0,0],sumPlace:0,points:0,hi:null,lo:null}));
  rows.forEach(x=>{const o=out[x.p];
    if(x.place){o.gp++;o.places[x.place]++;o.sumPlace+=x.place;}
    if(x.score!=null){o.points+=x.score;o.hi=o.hi==null?x.score:Math.max(o.hi,x.score);o.lo=o.lo==null?x.score:Math.min(o.lo,x.score);}});
  out.forEach(o=>{o.avg=o.gp?o.sumPlace/o.gp:null;o.points=Math.round(o.points*100)/100;});
  return out;
}
function seasonStandings(season){const a=agg(R.filter(x=>x.season===season));a.sort((x,y)=>(x.avg??9)-(y.avg??9)||y.places[1]-x.places[1]||y.points-x.points);return a;}
const f1=v=>v==null?"—":Math.round(v*10)/10;
const f2=v=>v==null?"—":(Math.round(v*100)/100);

function stackedFinish(a){

  a.forEach((o,i)=>{const y=i*rowH+8;let x=padL;
    s+=`<text class="axislbl" x="${padL-10}" y="${y+3}" text-anchor="end" style="fill:var(--ink-2);font-weight:600">${nm(o.p)}</text>`;
    for(let pl=1;pl<=6;pl++){const w=(o.places[pl]/max)*(W-padL-padR);
      if(w>0)s+=`<rect x="${x+1}" y="${y-8}" width="${Math.max(0,w-2)}" height="16" fill="${placeBG(pl)}" stroke="var(--surface)" stroke-width="1"><title>${nm(o.p)} — ${o.places[pl]}× ${ord(pl)}</title></rect>`;
      x+=w;}
    s+=`<text class="vallbl" x="${x+8}" y="${y+3}">${o.places[1]}×1st</text>`;});
  return s+`</svg>`;
}
function barChart(rows,{fmt=v=>v}={}){
  const W=720,rowH=32,padL=96,padR=70,H=rows.length*rowH+8;const max=Math.max(...rows.map(r=>r.value),1);
  let s=`<svg class="svgc" viewBox="0 0 ${W} ${H}" role="img">`;
  rows.forEach((r,i)=>{const y=i*rowH+8,w=Math.max(2,(r.value/max)*(W-padL-padR));
    s+=`<text class="axislbl" x="${padL-10}" y="${y+3}" text-anchor="end" style="fill:var(--ink-2);font-weight:600">${r.label}</text>`;

    s+=`<text class="vallbl" x="${padL+w+8}" y="${y+3}">${fmt(r.value)}</text>`;});

}

function ordinalWeeks(season){

  const po=labels.filter(l=>!/^week/i.test(l));const order=l=>({p1:1,p2:2,champ:3,championships:3,cs:3}[l.toLowerCase()]??9);
  po.sort((a,b)=>order(a)-order(b));return reg.concat(po);
}

/* ---- Payout logic ----
   Each player pays $30 to the winner of the 4 positive contests.
   The "winner" of each of the 2 skunk contests pays $30 to every other player. */
const PAYOUT_UNIT=30;
function payoutData(season){
  const a=seasonStandings(season);
  const participants=a.filter(o=>o.gp>0).map(o=>o.p);
  const N=participants.length, u=PAYOUT_UNIT;
  const pos=CONTESTS.filter(c=>c[0].indexOf("🦨")<0);   // 4 positive
  const sk =CONTESTS.filter(c=>c[0].indexOf("🦨")>=0);   // 2 skunk
  const posWin=pos.map(c=>c[2](a)[0].p);
  const skLose=sk.map(c=>c[2](a)[0].p);
  const rows=participants.map(p=>{
    const posWon=posWin.filter(w=>w===p).length;
    const skOf =skLose.filter(l=>l===p).length;
    const received=posWon*u*(N-1) + (sk.length-skOf)*u;   // from contests won + from each skunk you avoided
    const paid=(pos.length-posWon)*u + skOf*u*(N-1);       // to winners you lost to + your own skunk penalties
    return {p,posWon,skOf,received,paid,net:received-paid,
            wonNames:pos.filter((c,i)=>posWin[i]===p).map(c=>c[0]),
            skNames:sk.filter((c,i)=>skLose[i]===p).map(c=>c[0])};
  });
  return {rows,N,u};
}
function settleUp(rows){                                   // greedy fewest-transactions settlement
  const cr=[],db=[];
  rows.forEach(o=>{const v=Math.round(o.net); if(v>0)cr.push({p:o.p,amt:v}); else if(v<0)db.push({p:o.p,amt:-v});});
  cr.sort((x,y)=>y.amt-x.amt); db.sort((x,y)=>y.amt-x.amt);
  const tx=[];let i=0,j=0;
  while(i<cr.length&&j<db.length){const pay=Math.min(cr[i].amt,db[j].amt);
    if(pay>0)tx.push({from:db[j].p,to:cr[i].p,amt:pay});
    cr[i].amt-=pay; db[j].amt-=pay;
    if(cr[i].amt===0)i++; if(db[j].amt===0)j++;}
  return tx;
}
function payoutSection(season){
  const d=payoutData(season);
  const dollars=v=>'$'+v.toLocaleString();
  const net=v=>(v<0?'−$':'+$')+Math.abs(v).toLocaleString();
  let h=`<h2 class="section">💰 Payout Tracker <span class="tag">$${d.u} per contest · ${d.N} players</span></h2>`;
  h+=`<div class="notice">Everyone pays <b>$30</b> to each winner of <b>Most Firsts</b>, <b>Best Avg</b>, <b>Highest Single</b>, and <b>Most Points</b>. The <b>🦨 Most Sixths</b> and <b>🦨 Fewest Points</b> loser each owes <b>$30 to every other player</b>. Net is what each player collects (+) or owes (−) for the season.</div>`;
  h+=`<div class="card"><table class="tbl-payout"><thead><tr><th>Player</th><th>Contests Won</th><th>🦨 Skunks</th><th>Collects</th><th>Pays</th><th>Net</th></tr></thead><tbody>`;
  d.rows.slice().sort((x,y)=>y.net-x.net).forEach(o=>{
    h+=`<tr><td class="who">${dot(o.p)}${nm(o.p)}</td>
      <td class="tnum" style="color:var(--gold)">${o.posWon||'—'}</td>
      <td class="tnum" style="color:var(--bad)">${o.skOf||'—'}</td>
      <td class="tnum">${dollars(o.received)}</td><td class="tnum">${dollars(o.paid)}</td>
      <td class="tnum" style="font-weight:800;color:${o.net>=0?'var(--good)':'var(--bad)'}">${net(o.net)}</td></tr>`;});
  h+=`</tbody></table></div>`;
  const tx=settleUp(d.rows);
  h+=`<div style="margin-top:12px"><button class="btn" onclick="togglePayout()"><span id="payoutCaret">▸</span> &nbsp;Simplified settle-up — fewest transactions (${tx.length})</button></div>`;
  h+=`<div id="payoutDrill" style="display:none;margin-top:12px"><div class="card">`;
  if(!tx.length){h+=`<div style="color:var(--muted)">Everyone's square — no payments needed.</div>`;}
  else{h+=`<div class="hint" style="margin:0 0 8px">Just these ${tx.length} payments settle every balance:</div>`;
    tx.forEach(t=>{h+=`<div style="display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--border)">
      <span class="who">${dot(t.from)}${nm(t.from)}</span><span style="color:var(--muted)">pays</span>
      <span class="who">${dot(t.to)}${nm(t.to)}</span>
      <span class="tnum" style="margin-left:auto;font-weight:800;color:var(--good)">$${t.amt.toLocaleString()}</span></div>`;});}
  h+=`</div></div>`;
  return h;
}

function careerAgg(){const a=agg(R);a.forEach(o=>{o.titles=0;o.seasons=new Set();});
  SEASONS.forEach(s=>{const c=champOf(s);if(c!=null)a[c].titles++;});
  R.forEach(x=>a[x.p].seasons.add(x.season));a.forEach(o=>o.ns=o.seasons.size);return a;}
function renderHistory(){
  // Contest winners by season
  let h=`<h2 class="section">Contest Winners by Season</h2><div class="card wk"><table><thead><tr><th>Season</th>${CONTESTS.map(c=>`<th style="text-align:center">${CONTEST_SHORT[c[0]]||c[0]}</th>`).join("")}</tr></thead><tbody>`;
  SEASONS.slice().sort((a,b)=>b-a).forEach(s=>{const w=contestWinners(s);if(!w)return;
    h+=`<tr><td class="wklbl">${s}</td>${CONTESTS.map(c=>{const p=w[c[0]];return `<td style="text-align:center"><span class="who" style="justify-content:center">${dot(p)}${nm(p)}</span></td>`;}).join("")}</tr>`;});
  h+=`</tbody></table></div>`;
  // All-time leaderboard, ranked by contest wins
  const cw=careerContestWins();
  const a=careerAgg();a.forEach(o=>o.cw=cw[o.p]);
  a.sort((x,y)=>y.cw-x.cw||(x.avg??9)-(y.avg??9));
  h+=`<h2 class="section">All-Time Leaderboard</h2><div class="card"><table class="tbl-leader"><thead><tr><th>Player</th><th>Contest Wins</th><th>Avg Fin</th><th>1sts</th><th>6ths 🦨</th><th>Total Pts</th><th>Seasons</th></tr></thead><tbody>`;
  a.forEach((o,i)=>{h+=`<tr><td class="who"><span class="rank tnum">${i+1}</span>${dot(o.p)}${nm(o.p)}</td>
    <td class="tnum" style="font-weight:800;color:var(--gold)">${o.cw}</td><td class="tnum" style="font-weight:700">${f1(o.avg)}</td>
    <td class="tnum" style="color:var(--gold)">${o.places[1]}</td><td class="tnum" style="color:var(--bad)">${o.places[6]}</td>
    <td class="tnum">${o.points.toLocaleString()}</td><td class="tnum">${o.ns}</td></tr>`;});
  h+=`</tbody></table></div>`;
  const bars=a.slice().sort((x,y)=>y.cw-x.cw).map(o=>({label:nm(o.p),value:o.cw,color:SERIES[o.p]}));
  h+=`<h2 class="section">All-Time Contest Wins</h2><div class="card">${barChart(bars,{fmt:v=>v})}</div>`;
  el("view-history").innerHTML=h;
}
function wkName(w){return /^week/i.test(w)?w:({p1:"Playoff R1",p2:"Playoff R2"}[w.toLowerCase()]||"Championship");}
function renderRecords(){
  const scored=R.filter(x=>x.score!=null);
  if(!scored.length){el("view-records").innerHTML="<div class='card'>No scored results yet.</div>";return;}
  const hi=scored.reduce((m,x)=>x.score>m.score?x:m);const lo=scored.reduce((m,x)=>x.score<m.score?x:m);
  let mostF={v:-1},mostS={v:-1},bestAvg={v:9},mostP={v:-1};
  SEASONS.forEach(s=>seasonStandings(s).forEach(o=>{
    if(o.places[1]>mostF.v)mostF={v:o.places[1],p:o.p,s};
    if(o.places[6]>mostS.v)mostS={v:o.places[6],p:o.p,s};
    if(o.avg!=null&&o.avg<bestAvg.v)bestAvg={v:o.avg,p:o.p,s};
    if(o.points>mostP.v)mostP={v:o.points,p:o.p,s};}));
  const cw=careerContestWins();let mcw={v:-1};PLAYERS.forEach((_,p)=>{if(cw[p]>mcw.v)mcw={v:cw[p],p};});
  const tile=(k,v,s)=>`<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  let h=`<h2 class="section">Record Book — All Time</h2><div class="grid g3">`;
  h+=tile("Highest single score",`${f2(hi.score)}`,`${nm(hi.p)} · ${hi.season} ${wkName(hi.week)}`);
  h+=tile("Lowest single score",`${f2(lo.score)}`,`${nm(lo.p)} · ${lo.season} ${wkName(lo.week)}`);
  h+=tile("Most 1sts, one season",`${mostF.v}`,`${nm(mostF.p)} · ${mostF.s}`);
  h+=tile("Most skunks (6ths), one season",`${mostS.v}`,`${nm(mostS.p)} · ${mostS.s}`);
  h+=tile("Best season avg finish",`${f1(bestAvg.v)}`,`${nm(bestAvg.p)} · ${bestAvg.s}`);
  h+=tile("Most points, one season",`${f2(mostP.v)}`,`${nm(mostP.p)} · ${mostP.s}`);
  h+=tile("Most contest wins (all-time)",`${mcw.v} 🏆`,`${nm(mcw.p)}`);
  h+=`</div>`;el("view-records").innerHTML=h;
}
function renderSkunks(){
  const scored=R.filter(x=>x.score!=null).slice().sort((a,b)=>a.score-b.score);
  if(!scored.length){el("view-skunks").innerHTML=`<div class="card">No scores yet.</div>`;return;}
  const TOP=Math.min(15,scored.length);
  const list=scored.slice(0,TOP);
  let h=`<h2 class="section">🦨 Hall of Shame — Lowest Single Scores, All Time</h2>`;
  h+=`<div class="card"><table><thead><tr><th>Rank</th><th>Degenerate</th><th>Score</th><th>Season</th><th>When</th></tr></thead><tbody>`;
  list.forEach((x,i)=>{h+=`<tr><td class="tnum">${i+1}</td><td class="who">${dot(x.p)}${nm(x.p)}</td>
    <td class="tnum" style="font-weight:800;color:var(--bad)">${f2(x.score)}</td>
    <td class="tnum">${x.season}</td><td style="text-align:left;color:var(--ink-2)">${wkName(x.week)}</td></tr>`;});
  h+=`</tbody></table></div>`;
  // chart 1: the lowest 15 scores
  const bars1=list.map(x=>({label:`${nm(x.p).split(" ")[0]} '${String(x.season).slice(2)}`,value:f2(x.score),color:"--bad"}));
  h+=`<div class="grid g2" style="margin-top:16px">
    <div><h2 class="section">The 15 Lowest Scores</h2><div class="card">${barChart(bars1,{fmt:f2})}</div></div>`;
  // chart 2: all-time last-place (6th) finishes by player
  const car=careerAgg();
  const bars2=car.slice().sort((x,y)=>y.places[6]-x.places[6]).map(o=>({label:nm(o.p),value:o.places[6],color:SERIES[o.p]}));
  h+=`<div><h2 class="section">All-Time Skunks (6th-place finishes)</h2><div class="card">${barChart(bars2,{fmt:v=>v})}</div></div></div>`;
  // a couple of skunk stat tiles
  const worstPlayer=car.slice().sort((x,y)=>y.places[6]-x.places[6])[0];
  const personalWorst={};car.forEach(o=>{const s=scored.find(x=>x.p===o.p);personalWorst[o.p]=s?s.score:null;});
  h+=`<h2 class="section">Skunk Notes</h2><div class="grid g3">
    <div class="tile"><div class="k">All-time low</div><div class="v" style="color:var(--bad)">${f2(list[0].score)}</div><div class="s">${nm(list[0].p)} · ${list[0].season} ${wkName(list[0].week)}</div></div>
    <div class="tile"><div class="k">Most 6th-place finishes</div><div class="v">${dot(worstPlayer.p)} ${nm(worstPlayer.p)}</div><div class="s">${worstPlayer.places[6]} skunks all-time</div></div>
    <div class="tile"><div class="k">Sub-75 point weeks</div><div class="v">${scored.filter(x=>x.score<75).length}</div><div class="s">across ${SEASONS.length} seasons</div></div>
  </div>`;
  el("view-skunks").innerHTML=h;
}
function renderDynasty(){
  let h=`<h2 class="section">Dynasty Grid — season finish by avg place</h2><div class="card wk"><table><thead><tr><th>Player</th>${SEASONS.map(s=>`<th>${String(s).slice(2)}</th>`).join("")}<th>Wins</th></tr></thead><tbody>`;
  const rankBySeason={};SEASONS.forEach(s=>{const st=seasonStandings(s);rankBySeason[s]={};st.forEach((o,i)=>rankBySeason[s][o.p]=i+1);});
  const cw=careerContestWins();
  const car=careerAgg().sort((x,y)=>cw[y.p]-cw[x.p]||(x.avg??9)-(y.avg??9));
  car.forEach(o=>{h+=`<tr><td class="wklbl">${dot(o.p)}${nm(o.p)}</td>`;
    SEASONS.forEach(s=>{const rk=rankBySeason[s][o.p];
      h+=`<td class="pl" style="width:56px;background:${placeBG(rk)}"><div class="cellwrap"><span class="p">${rk||'—'}</span></div></td>`;});
    h+=`<td class="tnum" style="font-weight:800;color:var(--gold)">${cw[o.p]||'—'}</td></tr>`;});
  h+=`</tbody></table></div><p class="hint">Each cell = that player's finishing rank (1–6 by average place) that season (green good, red skunk). <b>Wins</b> = total individual-contest wins all-time.</p>`;
  el("view-dynasty").innerHTML=h;
}

  }else{

  }
  h+=`<div class="card" style="max-width:640px"><div class="form-row">
    <div class="field"><label>Season</label><input id="e_season" type="number" value="${CURRENT_SEASON}" style="width:100px"></div>
    <div class="field"><label>Week</label><select id="e_week">${WEEK_OPTIONS.map(w=>`<option value="${w.value}" data-kind="${w.kind}">${w.label}</option>`).join("")}</select></div>

      <td><select id="e_place_${i}"><option value="">—</option>${[1,2,3,4,5,6].map(n=>`<option value="${n}">${n}</option>`).join("")}</select></td>
      <td><input id="e_score_${i}" type="number" step="0.01" placeholder="0.00"></td></tr>`).join("")}
  </tbody></table>
  <div style="margin-top:16px;display:flex;gap:12px;align-items:center">
    <button class="btn primary" id="e_submit" ${configured?"":"disabled"}>Save to Sheet</button>
    <span style="font-size:12.5px;color:var(--muted)">Tip: leave a player blank if they missed the slate.</span>
  </div>
  <div class="msg" id="e_msg"></div>
  </div>`;
  el("view-enter").innerHTML=h;
  if(configured) el("e_submit").addEventListener("click",submitWeek);
}
function submitWeek(){
  const btn=el("e_submit"),msg=el("e_msg");
  const season=+el("e_season").value;
  const wsel=el("e_week");const week=wsel.value;const kind=wsel.selectedOptions[0].dataset.kind;
  const password=el("e_pw").value;
  if(!password){return showMsg("err","Enter the league password.");}
  const rows=[],places=[];
  for(let i=0;i<PLAYERS.length;i++){
    const pv=el("e_place_"+i).value, sv=el("e_score_"+i).value;
    if(pv==="") continue;
    const place=+pv, score=(sv==="")?null:+sv;
    places.push(place);
    rows.push([season,week,kind,PLAYERS[i],place,score]);
  }
  if(!rows.length){return showMsg("err","Enter at least one player's finish.");}
  const dups=places.length!==new Set(places).size;
  btn.disabled=true;btn.textContent="Saving…";
  fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({password,season,week,kind,replace:true,rows})})
    .then(r=>r.json()).then(d=>{
      if(d.ok){showMsg("ok",`Saved ${d.added} results for ${season} · ${week}.`+(dups?" (Heads up: you had duplicate finishes.)":""));
        el("e_pw").value="";loadLive(true);}
      else{showMsg("err",d.error||"Save failed.");}
    }).catch(err=>showMsg("err","Network error: "+err))
    .finally(()=>{btn.disabled=false;btn.textContent="Save to Sheet";});
}
function showMsg(type,text){const m=el("e_msg");m.className="msg show "+type;m.textContent=text;}

/* Each pick: [pickNumber, playerIndex, teamFullName]  (playerIndex → PLAYERS) */
const ZPICKS=[
 [5,0,"Seattle Seahawks"],[8,0,"Denver Broncos"],[14,0,"Dallas Cowboys"],[21,0,"New Orleans Saints"],[29,0,"Las Vegas Raiders"],
 [3,1,"Detroit Lions"],[10,1,"Cincinnati Bengals"],[18,1,"Minnesota Vikings"],[19,1,"Tampa Bay Buccaneers"],[27,1,"Carolina Panthers"],
 [2,2,"Buffalo Bills"],[11,2,"Houston Texans"],[15,2,"Chicago Bears"],[24,2,"Washington Commanders"],[26,2,"New York Jets"],
 [4,3,"Baltimore Ravens"],[9,3,"New England Patriots"],[17,3,"Green Bay Packers"],[20,3,"Indianapolis Colts"],[28,3,"Arizona Cardinals"],
 [6,4,"Philadelphia Eagles"],[7,4,"San Francisco 49ers"],[13,4,"Los Angeles Chargers"],[22,4,"Pittsburgh Steelers"],[30,4,"Tennessee Titans"],
 [1,5,"Los Angeles Rams"],[12,5,"Kansas City Chiefs"],[16,5,"Jacksonville Jaguars"],[23,5,"New York Giants"],[25,5,"Atlanta Falcons"]
];
/* offline fallback snapshot — team: [wins, losses] as of 2026 Week 4 */
const NFL_SNAP={
 "Arizona Cardinals":[1,3],"Atlanta Falcons":[2,2],"Baltimore Ravens":[3,1],"Buffalo Bills":[3,1],
 "Carolina Panthers":[2,2],"Chicago Bears":[3,1],"Cincinnati Bengals":[2,2],"Cleveland Browns":[3,1],
 "Dallas Cowboys":[2,2],"Denver Broncos":[2,2],"Detroit Lions":[2,2],"Green Bay Packers":[2,2],
 "Houston Texans":[0,4],"Indianapolis Colts":[2,2],"Jacksonville Jaguars":[3,1],"Kansas City Chiefs":[4,0],
 "Las Vegas Raiders":[3,1],"Los Angeles Chargers":[0,4],"Los Angeles Rams":[2,2],"Miami Dolphins":[0,4],
 "Minnesota Vikings":[4,0],"New England Patriots":[2,2],"New Orleans Saints":[1,3],"New York Giants":[3,1],
 "New York Jets":[1,3],"Philadelphia Eagles":[2,2],"Pittsburgh Steelers":[2,2],"San Francisco 49ers":[4,0],
 "Seattle Seahawks":[3,1],"Tampa Bay Buccaneers":[0,4],"Tennessee Titans":[0,4],"Washington Commanders":[1,3]
};
let NFLW=Object.assign({},NFL_SNAP);
let ZSTATUS={live:false,when:null};
const NFL_API="https://site.web.api.espn.com/apis/v2/sports/football/nfl/standings?region=us&lang=en&contentorigin=espn&type=2&level=1&season=2026";
/* recursively pull team → [wins,losses] out of ESPN's standings JSON (shape-agnostic) */
function parseNFL(json){
  const out={};
  (function walk(o){
    if(!o||typeof o!=='object')return;
    if(Array.isArray(o)){o.forEach(walk);return;}
    const t=o.team;
    if(t&&(t.displayName||t.name)&&Array.isArray(o.stats)){
      let w=null,l=null;
      o.stats.forEach(s=>{const k=(s.type||s.name||'').toLowerCase();
        if(k==='wins')w=+s.value; else if(k==='losses')l=+s.value;});
      if(w!=null)out[t.displayName||t.name]=[w,(l==null?null:l)];
    }
    for(const k in o)walk(o[k]);
  })(json);
  return out;
}
function loadNFL(){
  fetch(NFL_API).then(r=>r.json()).then(j=>{
    const m=parseNFL(j);
    if(Object.keys(m).length>=20){          // sanity: got most of the league
      NFLW=Object.assign({},NFL_SNAP,m);
      ZSTATUS={live:true,when:new Date()};
      renderZooter();
    }
  }).catch(()=>{});                          // stay on snapshot if blocked/offline
}
const nflWL=team=>NFLW[team]||NFL_SNAP[team]||[0,0];
const nflWins=team=>nflWL(team)[0]||0;
function zStandings(){
  const tot=PLAYERS.map((_,i)=>({p:i,wins:0,teams:0}));
  ZPICKS.forEach(([n,p,team])=>{tot[p].wins+=nflWins(team);tot[p].teams++;});
  tot.sort((a,b)=>b.wins-a.wins);
  return tot;
}
function renderZooter(){
  const st=zStandings();const lead=st.length?st[0].wins:0;
  const badge=ZSTATUS.live
    ? `<span style="font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;display:inline-block;border:1px solid color-mix(in srgb,var(--good) 40%,transparent);color:var(--good)">● live from ESPN${ZSTATUS.when?' · '+ZSTATUS.when.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):''}</span>`
    : `<span style="font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;display:inline-block;border:1px solid var(--border);color:var(--muted)">snapshot · Week 4</span>`;
  let h=`<h2 class="section">2026 NFL Wins Pool ${badge}</h2>`;
  h+=`<div class="notice">Each player drafts <b>5 NFL teams</b>; whoever's teams pile up the most combined wins over the season takes it. Records pull <b>live from ESPN</b> each time the page loads. <button class="btn" id="z_refresh" style="margin-left:6px">↻ Refresh</button></div>`;
  // Dynamic summary
  h+=`<div class="card"><table class="tbl-winpool"><thead><tr><th>Player</th><th>Total Wins</th><th>Teams</th><th>Avg / Team</th></tr></thead><tbody>`;
  st.forEach((o,i)=>{const isLead=o.wins===lead;
    h+=`<tr><td class="who"><span class="rank tnum">${i+1}</span>${dot(o.p)}${nm(o.p)} ${isLead?'<span class="badge-champ">🏈 LEAD</span>':''}</td>
      <td class="tnum" style="font-weight:800;color:${isLead?'var(--gold)':'var(--ink)'}">${o.wins}</td>
      <td class="tnum">${o.teams}</td><td class="tnum">${(o.wins/o.teams).toFixed(2)}</td></tr>`;});
  h+=`</tbody></table></div>`;
  // Full detail — each player's 5 teams as a compact card, side by side
  h+=`<h2 class="section">The Picks</h2><div class="zgrid">`;
  st.forEach(o=>{
    const picks=ZPICKS.filter(x=>x[1]===o.p).map(x=>{const r=nflWL(x[2]);return {n:x[0],team:x[2],w:r[0],l:r[1]};}).sort((a,b)=>b.w-a.w);
    h+=`<div class="zcard"><div class="zhead">${dot(o.p)}<span class="nm">${nm(o.p)}</span><span class="tot">${o.wins}</span></div>`;
    picks.forEach(pk=>{const nick=pk.team.split(' ').pop();
      h+=`<div class="zrow"><span class="t"><span class="pn">${pk.n}.</span> ${nick}</span><span class="r">${pk.w}-${pk.l==null?'?':pk.l}</span></div>`;});
    h+=`</div>`;
  });
  h+=`</div>`;
  h+=`<h2 class="section">Total Wins</h2><div class="card">${barChart(st.map(o=>({label:nm(o.p),value:o.wins,color:SERIES[o.p]})),{fmt:v=>v})}</div>`;
  el("view-zooter").innerHTML=h;
  const rb=el("z_refresh");if(rb)rb.addEventListener("click",()=>{rb.textContent="↻ …";loadNFL();});
}

/* ============ WIRE ============ */

2025, "Week 1", "r", "Chais", 3, 140.16

function markLive(on){const p=el("statusPill");if(on){p.textContent="● live from Sheet";p.classList.add("live");}else{p.textContent="local data";p.classList.remove("live");}}
function loadLive(silent){
  if(!API_URL || API_URL.includes("PASTE_YOUR")) return;
  fetch(API_URL).then(r=>r.json()).then(d=>{
    if(d&&d.ok&&d.rows&&d.rows.length){ingest(d.rows);markLive(true);renderAll();}
  }).catch(()=>{ if(!silent) markLive(false); });
}

ingest(RAW);
